version: "3.9"
services:
  node1:
    image: ethereum/client-go:v1.13.15
    container_name: bxb-clique-node1
    command:
      - --datadir=/data
      - --config=/data/config.toml
      - --networkid=31337
      - --http
      - --http.addr=0.0.0.0
      - --http.port=8545
      - --http.api=eth,net,web3,personal,admin,clique,txpool
      - --http.corsdomain=*
      - --http.vhosts=*
      - --port=30303
      - --nodiscover
      - --unlock=0xfCA42061f09eC014A93AF3Bb56188F522142604C
      - --password=/data/password.txt
      - --allow-insecure-unlock
      - --mine
      - --miner.etherbase=0xfCA42061f09eC014A93AF3Bb56188F522142604C
      - --syncmode=full
      - --verbosity=3
    ports:
      - "8551:8545"
    volumes:
      - ./node1:/data
    networks:
      - clique-net

  node2:
    image: ethereum/client-go:v1.13.15
    container_name: bxb-clique-node2
    command:
      - --datadir=/data
      - --config=/data/config.toml
      - --networkid=31337
      - --http
      - --http.addr=0.0.0.0
      - --http.port=8545
      - --http.api=eth,net,web3,personal,admin,clique,txpool
      - --http.corsdomain=*
      - --http.vhosts=*
      - --port=30303
      - --nodiscover
      - --unlock=0x4Ab617F191dAfeeCfF74FDB38Ae520218fc5D01A
      - --password=/data/password.txt
      - --allow-insecure-unlock
      - --mine
      - --miner.etherbase=0x4Ab617F191dAfeeCfF74FDB38Ae520218fc5D01A
      - --syncmode=full
      - --verbosity=3
    ports:
      - "8552:8545"
    volumes:
      - ./node2:/data
    networks:
      - clique-net

  node3:
    image: ethereum/client-go:v1.13.15
    container_name: bxb-clique-node3
    command:
      - --datadir=/data
      - --config=/data/config.toml
      - --networkid=31337
      - --http
      - --http.addr=0.0.0.0
      - --http.port=8545
      - --http.api=eth,net,web3,personal,admin,clique,txpool
      - --http.corsdomain=*
      - --http.vhosts=*
      - --port=30303
      - --nodiscover
      - --unlock=0xf202971A47269DE36B6Bd3fd48b4c1c6EB921D73
      - --password=/data/password.txt
      - --allow-insecure-unlock
      - --mine
      - --miner.etherbase=0xf202971A47269DE36B6Bd3fd48b4c1c6EB921D73
      - --syncmode=full
      - --verbosity=3
    ports:
      - "8553:8545"
    volumes:
      - ./node3:/data
    networks:
      - clique-net

networks:
  clique-net:
    driver: bridge