name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check entry point
        run: node --check src/server.js

  # docker-build:
  #   Add this job once backend/Dockerfile exists.
  #   It's a separate job (not a step above) because it validates the actual
  #   deployable image, not just the raw code — catches broken COPY paths,
  #   bad base image tags, etc. before they reach Cloud Run.
  #
  #   docker-build:
  #     runs-on: ubuntu-latest
  #     steps:
  #       - uses: actions/checkout@v4
  #       - uses: docker/build-push-action@v6
  #         with:
  #           context: ./backend
  #           push: false   # verify it builds only — actual push/deploy is a
  #                         # separate CD workflow, usually gated to main only

  # web:
  #   Add this job once /web has its own package.json.
  #   Copy the backend job above, change working-directory to "web",
  #   and swap the syntax-check step for `npm run build`.

  # mobile:
  #   Add this job once /mobile has a package.json (Expo project initialized).
  #   Typically: npm ci, then `npx tsc --noEmit` if you're on TypeScript.